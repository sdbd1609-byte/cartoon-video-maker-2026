
name: Build Cartoon Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Generate video
        run: python make_video.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-video
          path: rabbit_magic_star.mp4
